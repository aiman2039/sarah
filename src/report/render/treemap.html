<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sarah report</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#dddcd6;--ok:#5b8def;--warn:#e0663a;--tile:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--text:#ecebe6;--muted:#9b9a93;--line:#34332f;--ok:#4d7ad4;--warn:#d6582d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif}
main{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:24px 0 8px}.muted{color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin:12px 0 16px}.stats b{font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.crumbs button,.bar select,.bar input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.crumbs button,.bar select{cursor:pointer}.crumbs{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
#map{position:relative;width:100%;height:min(68vh,620px);background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tile{position:absolute;overflow:hidden;border:1px solid var(--panel);color:var(--tile);font-size:12px;padding:2px 4px;cursor:pointer;white-space:nowrap;text-overflow:ellipsis}
.tile.dir{background:transparent;border-color:var(--line);color:var(--muted);padding:0;cursor:zoom-in}
.tile.dir>.label{padding:1px 4px;font-weight:600}
#tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;box-shadow:0 4px 14px rgb(0 0 0/.15);display:none;max-width:360px;z-index:2}
.legend{display:flex;gap:12px;font-size:12px}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:600;color:var(--muted)}
td.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}.scroll{overflow-x:auto}#insp{display:none}
</style>
</head>
<body>
<main>
  <h1>sarah report</h1><div class="muted" id="sub"></div><div class="stats" id="stats"></div>
  <div class="bar">
    <div class="crumbs" id="crumbs"></div>
    <input id="q" type="search" placeholder="Filter files...">
    <label class="muted">Size <select id="size"><option value="tokens">tokens</option><option value="lines">lines</option></select></label>
    <label class="muted">Color <select id="color"><option value="warn">warnings</option><option value="cog">cognitive</option></select></label>
    <div class="legend"><span><span class="sw" style="background:var(--ok)"></span>low</span><span><span class="sw" style="background:var(--warn)"></span>warn / hot</span></div>
  </div>
  <div id="map" role="img" aria-label="Treemap of files by size"></div>
  <section id="insp"><h2 id="insp-t"></h2><div class="scroll"><table id="insp-f"></table></div></section>
  <h2 id="wt">Warnings</h2><div class="scroll"><table id="wtbl"></table></div>
</main>
<div id="tip"></div>
<script type="application/json" id="data">__SARAH_DATA__</script>
<script>
(()=>{
  const D=JSON.parse(document.getElementById("data").textContent),$=(i)=>document.getElementById(i);
  const fmt=(n)=>n.toLocaleString("en-US"),esc=(s)=>String(s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
  const T=D.totals;$("sub").textContent=`Tokenizer ${D.tokenizer}`;
  $("stats").innerHTML=[["files",T.files],["lines",T.lines],["code",T.code],["tokens",T.tokens],["warnings",D.warnings.length]].map(([k,v])=>`<span><b>${fmt(v)}</b> <span class="muted">${k}</span></span>`).join("");
  let m="tokens",cm="warn",q="",root=null,cur=null,maxL=1,maxC=1;
  function build(){
    root={name:".",path:"",ch:new Map(),fs:[]};const s=q.toLowerCase();
    for(const f of D.files){
      if(s&&!f.path.toLowerCase().includes(s))continue;
      let n=root;
      for(const p of f.path.split("/").slice(0,-1)){
        if(!n.ch.has(p))n.ch.set(p,{name:p,path:n.path?`${n.path}/${p}`:p,ch:new Map(),fs:[],up:n});
        n=n.ch.get(p);
      }
      n.fs.push(f);
    }
    cur=root;
  }
  const wt=(n)=>n.file?n.file[m]:[...n.ch.values()].reduce((a,c)=>a+wt(c),0)+n.fs.reduce((a,f)=>a+f[m],0);
  const items=(n)=>[...[...n.ch.values()].map((d)=>({dir:d,w:wt(d)})),...n.fs.map((f)=>({file:f,w:f[m]}))].filter((x)=>x.w>0).sort((a,b)=>b.w-a.w);
  function sq(list,x,y,w,h){
    const out=[],tot=list.reduce((a,i)=>a+i.w,0);if(!tot)return out;
    let rest=list.map((i)=>({...i,a:i.w*(w*h)/tot}));
    while(rest.length){
      const s=Math.min(w,h);let row=[],best=1/0;
      for(const it of rest){
        const nx=[...row,it],sum=nx.reduce((a,i)=>a+i.a,0),mx=Math.max(...nx.map((i)=>i.a)),mn=Math.min(...nx.map((i)=>i.a));
        const wr=Math.max((s*s*mx)/(sum*sum),(sum*sum)/(s*s*mn));if(wr>best)break;best=wr;row=nx;
      }
      const sum=row.reduce((a,i)=>a+i.a,0),th=sum/s;let off=0;
      for(const it of row){const ln=it.a/th;out.push(w>=h?{...it,x,y:y+off,w:th,h:ln}:{...it,x:x+off,y,w:ln,h:th});off+=ln;}
      if(w>=h){x+=th;w-=th;}else{y+=th;h-=th;}rest=rest.slice(row.length);
    }
    return out;
  }
  const map=$("map"),tip=$("tip");
  const bg=(f)=>cm==="warn"?(f.warnings?"var(--warn)":"var(--ok)"):`hsl(${Math.round(215-198*Math.min(1,(f.cognitive||0)/maxC))} 72% 48%)`;
  function inspect(f){
    $("insp").style.display="block";const fns=[...(f.fns||[])].sort((a,b)=>b.lines-a.lines);
    $("insp-t").textContent=`${f.path} (${fns.length} functions)`;
    $("insp-f").innerHTML=fns.length?`<tr><th>Function</th><th>Line</th><th>Lines</th><th>Tokens</th><th>Depth</th><th>Cognitive</th></tr>`+fns.map((fn)=>
      `<tr><td class="path">${esc(fn.name)}</td><td>L${fn.line}</td><td>${fn.lines}</td><td>${fn.tokens}</td><td>${fn.depth}</td><td>${fn.cognitive}</td></tr>`).join("")
      :`<tr><td class="muted">No functions extracted.</td></tr>`;
  }
  function draw(n,x,y,w,h,d){
    for(const r of sq(items(n),x,y,w,h)){
      const el=document.createElement("div");el.className=r.dir?"tile dir":"tile";
      Object.assign(el.style,{left:`${r.x}px`,top:`${r.y}px`,width:`${r.w}px`,height:`${r.h}px`});
      if(r.file){
        el.style.background=bg(r.file);el.style.opacity=String(.6+.4*Math.min(1,r.file[m]/maxL));
        if(r.w>40&&r.h>16)el.textContent=r.file.path.split("/").pop();
        el.onmousemove=(e)=>show(e,`<b>${esc(r.file.path)}</b><br>${esc(r.file.language)} · ${fmt(r.file.tokens)} tokens · ${fmt(r.file.lines)} lines · cog ${r.file.cognitive||0}${r.file.warnings?`<br><b>${r.file.warnings}</b> warnings`:""}`);
        el.onclick=(e)=>{e.stopPropagation();inspect(r.file);};
      }else{
        el.onmousemove=(e)=>{if(e.target===el||e.target.className==="label")show(e,`<b>${esc(r.dir.path)}/</b><br>${fmt(wt(r.dir))} ${m}`);};
        el.onclick=(e)=>{e.stopPropagation();cur=r.dir;tip.style.display="none";render();};
        if(r.w>30&&r.h>18){const l=document.createElement("div");l.className="label";l.textContent=r.dir.name;el.appendChild(l);}
      }
      el.onmouseleave=()=>{tip.style.display="none";};map.appendChild(el);
      if(r.dir&&r.w>48&&r.h>48&&d<6)draw(r.dir,r.x+2,r.y+18,r.w-4,r.h-20,d+1);
    }
  }
  function show(e,html){tip.innerHTML=html;tip.style.display="block";const b=tip.getBoundingClientRect();
    tip.style.left=`${Math.min(e.clientX+14,innerWidth-b.width-8)}px`;tip.style.top=`${Math.min(e.clientY+14,innerHeight-b.height-8)}px`;}
  function render(){
    map.innerHTML="";maxL=Math.max(1,...D.files.map((f)=>f[m]));maxC=Math.max(1,...D.files.map((f)=>f.cognitive||0));
    const b=map.getBoundingClientRect();draw(cur,0,0,b.width,b.height,0);
    const ch=[];for(let n=cur;n;n=n.up)ch.unshift(n);$("crumbs").innerHTML="";
    for(const n of ch){const bt=document.createElement("button");bt.textContent=n===root?"root":n.name;bt.onclick=()=>{cur=n;render();};$("crumbs").appendChild(bt);}
    const s=q.toLowerCase(),ws=D.warnings.filter((w)=>!s||w.path.toLowerCase().includes(s)||w.message.toLowerCase().includes(s));
    $("wt").textContent=`Warnings (${ws.length})`;
    $("wtbl").innerHTML=ws.length?`<tr><th>Location</th><th>Kind</th><th>Message</th></tr>`+ws.map((w)=>`<tr><td class="path">${esc(w.path)}${w.line?`:${w.line}`:""}</td><td>${esc(w.kind)}</td><td>${esc(w.message)}</td></tr>`).join(""):`<tr><td class="muted">No warnings.</td></tr>`;
  }
  $("size").onchange=(e)=>{m=e.target.value;render();};$("color").onchange=(e)=>{cm=e.target.value;render();};
  $("q").oninput=(e)=>{q=e.target.value;build();render();};addEventListener("resize",render);build();render();
})();
</script>
</body>
</html>
