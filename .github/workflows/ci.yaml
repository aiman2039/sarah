name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Release runs it too, on the exact revision being released.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Release calls must finish; push and PR runs are superseded by newer commits.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_HUSKY_DONT_INSTALL_HOOKS: 'true'
  # No debug info in CI builds: a smaller target/ means faster cache save and restore.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev-${{ matrix.os }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Formatting
        run: sh scripts/check.sh fmt
      # Clippy compiles every target, so there is no separate build step.
      - name: Clippy (pedantic)
        run: sh scripts/check.sh clippy
      - name: Tests
        run: sh scripts/check.sh test
      # Reuses the debug build from the tests; one OS is enough for a size check.
      - name: Sarah on sarah
        if: runner.os == 'Linux'
        run: sh scripts/check.sh sarah
