name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag at the selected master revision
        required: false
        type: string

# Manual runs create v<package version> at the selected revision. The build
# stays in this run because tags created with GITHUB_TOKEN do not trigger runs.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.97.1'
  MACOSX_DEPLOYMENT_TARGET: '11.0'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and resolve immutable revision
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag="v${version}"
          git check-ref-format "refs/tags/$tag"
          # The plugins and the MCP Registry entry pin this version (scripts/bump-version.sh).
          python3 - "$version" <<'VERSIONS'
          import json, sys
          want = sys.argv[1]
          found = {
              "plugins/sarah/.claude-plugin/plugin.json": json.load(open("plugins/sarah/.claude-plugin/plugin.json"))["version"],
              "plugins/sarah/plugin.json": json.load(open("plugins/sarah/plugin.json"))["version"],
              "server.json": json.load(open("server.json"))["version"],
              "server.json packages[0]": json.load(open("server.json"))["packages"][0]["version"],
          }
          bad = {k: v for k, v in found.items() if v != want}
          if bad:
              raise SystemExit(f"::error::Versions differ from Cargo.toml ({want}): {bad}. Run scripts/bump-version.sh.")
          VERSIONS
          sha="$(git rev-parse HEAD)"
          # checks/security check out the workflow commit; it must be the released one.
          if [[ -n "$REQUESTED_TAG" && "$sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Requested tag must point to the selected workflow commit. Retry on the tag ref if master has moved."
            exit 1
          fi
          if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$tag" ]]; then
            echo "::error::Tag $REQUESTED_TAG must match package version $tag"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha" || {
              echo "::error::Existing tag $tag points to another commit; select that tag to retry or bump the version."
              exit 1
            }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$sha"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # CI also runs on push and PR; here it checks the exact revision being released.
  # Security runs only from Release.
  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  security:
    needs: prepare
    uses: ./.github/workflows/security.yaml
    permissions:
      contents: read

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-build
        with:
          runner-label: ${{ matrix.runner }}
          target: ${{ matrix.target }}
          rust-version: ${{ env.RUST_VERSION }}
          tag: ${{ needs.prepare.outputs.tag }}

  upload-draft:
    # Build in parallel with validation, but never upload unvalidated assets.
    needs: [prepare, checks, security, build]
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and upload release assets
        run: |
          set -euo pipefail
          cd dist
          # 5 archives + 5 MCP bundles.
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 10
          sha256sum ./*.tar.gz ./*.zip ./*.mcpb | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=()
            if [[ "$TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --generate-notes "${prerelease[@]}"
          fi
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]]; then
            echo "::error::Refusing to replace published release assets. Bump the version."
            exit 1
          fi
          gh release upload "$TAG" ./*.tar.gz ./*.zip ./*.mcpb SHA256SUMS.txt --clobber
          gh release view "$TAG" --json assets > "$RUNNER_TEMP/draft-assets.json"
          python3 - "$RUNNER_TEMP/draft-assets.json" <<'ASSETS'
          import json, pathlib, sys
          expected = {p.name for p in pathlib.Path('.').iterdir() if p.is_file()}
          actual = {a['name'] for a in json.load(open(sys.argv[1]))['assets']}
          if actual != expected:
              raise SystemExit('Draft contains unexpected or missing assets; review it before publication')
          ASSETS

  publish:
    needs: [prepare, upload-draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Publish complete validated draft
        run: gh release edit "$TAG" --draft=false --latest

  # crates.io trusted publishing (OIDC): no stored token. One-time setup: publish
  # the first version by hand (`cargo publish`), then add this repository and
  # release.yaml as a trusted publisher in the crate's crates.io settings.
  publish-crate:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      # A retried release must not fail because this version was already published.
      - name: Check whether this version is on crates.io
        id: exists
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -A "sarah-release (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/sarah/${TAG#v}")"
          if [[ "$status" == 200 ]]; then echo "published=true"; else echo "published=false"; fi >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.exists.outputs.published == 'false'
        id: auth
      - name: Publish to crates.io
        if: steps.exists.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CARGO_HUSKY_DONT_INSTALL_HOOKS: 'true'
        run: cargo publish --locked

  # Official MCP Registry (registry.modelcontextprotocol.io), via GitHub OIDC: no stored token.
  # The registry checks the crate: its README must show "mcp-name: io.github.aiman2039/sarah".
  publish-registry:
    needs: [prepare, publish-crate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          a="mcp-publisher_linux_amd64.tar.gz"
          b="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$a" "$b/$a"
          curl -fsSL -o "$a.sigstore.json" "$b/$a.sigstore.json"
          cosign verify-blob --bundle "$a.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$a"
          tar -xzf "$a" mcp-publisher
      - name: Publish server.json
        run: |
          set -euo pipefail
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json

  # Push the formula to the aiman2039/homebrew-tap repo. One-time setup: create that
  # repo and store a fine-grained PAT with contents:write on it as HOMEBREW_TAP_TOKEN.
  # Prereleases are skipped.
  publish-homebrew:
    needs: [prepare, publish]
    if: ${{ !contains(needs.prepare.outputs.tag, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Update the formula in the tap
        run: |
          set -euo pipefail
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."
            exit 0
          fi
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP"
          tap="$RUNNER_TEMP/tap"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/aiman2039/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          bash scripts/homebrew-formula.sh "$TAG" "$RUNNER_TEMP/SHA256SUMS.txt" > "$tap/Formula/sarah.rb"
          cd "$tap"
          if git diff --quiet -- Formula/sarah.rb && git ls-files --error-unmatch Formula/sarah.rb >/dev/null 2>&1; then
            echo "Formula is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sarah.rb
          git commit -m "sarah ${TAG#v}"
          git push

  # End-to-end check of the public action against the release just published.
  verify-action:
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: sarah
        uses: ./
        with:
          version: ${{ needs.prepare.outputs.tag }}
          fail-on-warn: true
      - name: Check action outputs
        env:
          REPORT: ${{ steps.sarah.outputs.json }}
          TOKENS: ${{ steps.sarah.outputs.tokens }}
          WARNINGS: ${{ steps.sarah.outputs.warnings }}
        run: |
          set -euo pipefail
          test -s "$REPORT"
          test "$TOKENS" -gt 0
          [[ "$WARNINGS" =~ ^[0-9]+$ ]]
          echo "tokens=$TOKENS warnings=$WARNINGS"
