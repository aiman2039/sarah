# Limits at today's maximums (`sarah init`): new code cannot be worse than the worst file today.
# `sarah ratchet` lowers them as the code improves; it never raises them.

preset = "rust"
unused_allow = true

[[files]]
path = "**"
max_file_tokens = 3131
max_file_lines = 341
max_file_fns = 22
max_fn_lines = 45
max_fn_tokens = 480
max_fn_depth = 3
max_fn_params = 3
max_fn_bool_params = 1
max_fn_cyclomatic = 21
max_fn_cognitive = 13
max_type_fields = 25
max_type_methods = 17

[[files]]
path = "src/units/**"
forbid_imports = ["crate::cli*", "crate::mcp*", "crate::report*"]

[[files]]
path = "tests/fixtures/allow/**"
unused_allow = false

[[folder]]
path = "src/**"
max_files = 8
max_dirs = 2
max_depth = 4
max_lines = 2239
max_tokens = 17397
min_files = 2
