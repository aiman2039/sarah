[graph]
all-features = true
# The release targets; platform-specific crates for other targets are not shipped.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
unmaintained = "workspace"
yanked = "deny"
# "workspace" reports unmaintained crates only when they are direct dependencies,
# so transitive notices (term_size via tokei) are ignored in .cargo/audit.toml only.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Transitive-only duplicates pinned by upstream; none are direct deps we can unify.
# Revisit on a tokei or clap upgrade.
skip = [
    { crate = "itertools", reason = "0.11 via tokei/table_formatter vs 0.15 via bpe" },
    { crate = "hashbrown", reason = "0.14 via tokei/dashmap vs 0.17 elsewhere" },
    { crate = "thiserror", reason = "v1 via tokei/table_formatter vs v2 elsewhere" },
    { crate = "thiserror-impl", reason = "v1 via tokei/table_formatter vs v2 elsewhere" },
    { crate = "winnow", reason = "0.7 via tokei/toml 0.9 vs 1.x elsewhere" },
    { crate = "syn", reason = "v3 via clap_derive vs v2 in other proc-macros" },
    { crate = "windows-sys", reason = "0.48 via tokei/etcetera, 0.59 via colored, 0.61 elsewhere" },
    { crate = "windows-targets", reason = "follows the windows-sys versions above" },
    { crate = "windows_x86_64_msvc", reason = "follows the windows-sys versions above" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[[licenses.clarify]]
crate = "cargo-husky"
expression = "MIT"
license-files = []
