[graph]
all-features = true
# The release targets; platform-specific crates for other targets are not shipped.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
unmaintained = "workspace"
yanked = "deny"
# "workspace" reports unmaintained crates only when they are direct dependencies,
# so transitive notices (term_size via tokei) are ignored in .cargo/audit.toml only.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[licenses]
confidence-threshold = 0.8
# sarah itself is publish = false until it has a license; dependencies are still checked.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[[licenses.clarify]]
crate = "cargo-husky"
expression = "MIT"
license-files = []
