[package]
name = "sarah"
version = "0.1.4"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Count tokens, lines and function sizes per file to help AI agents decide what to refactor"
repository = "https://github.com/aiman2039/sarah"
readme = "README.md"
keywords = ["tokens", "refactoring", "ai", "cli", "code-metrics"]
categories = ["command-line-utilities", "development-tools"]
# Only what `cargo install` needs; CI, scripts and agent docs stay out of the package.
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0.104"
bpe-openai = "0.3.2"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
derive_more = { version = "2", features = ["display", "from_str"] }
dunce = "1.0.5"
globset = "0.4.20"
ignore = "0.4.33"
rayon = "1.12.0"
regex-automata = "0.4.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokei = { version = "15.0.0", default-features = false }
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-tags = "0.27.1"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["filters"] }

[dev-dependencies.cargo-husky]
version = "1.5.0"
default-features = false
features = ["user-hooks"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Lint policy: rust.md. `scripts/check.sh clippy` adds `-D warnings`, so pedantic
# warnings fail CI and the pre-commit hook too. Pedantic is priority -1 so the
# per-lint levels below win.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Pedantic overrides - too noisy or not applicable
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
items_after_statements = "allow"
return_self_not_must_use = "allow"
cast_precision_loss = "allow"
default_trait_access = "allow"
match_same_arms = "allow"
unused_async = "allow"
manual_let_else = "allow"
used_underscore_binding = "allow"
ref_option_ref = "allow"
ref_option = "allow"
format_push_string = "allow"
case_sensitive_file_extension_comparisons = "allow"
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
no_effect_underscore_binding = "allow"
redundant_closure_for_method_calls = "allow"
wildcard_imports = "allow"

# Panic safety
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"

# Suppressions must be #[expect(lint, reason = "...")]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

uninlined_format_args = "deny"
result_large_err = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
self_named_module_files = "deny"

# Beyond rust.md: Arc/Rc clones must be explicit (Arc::clone(&x)).
clone_on_ref_ptr = "deny"
